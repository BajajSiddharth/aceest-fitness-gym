name: ACEest Fitness CI/CD Pipeline

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies & lint tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest -r requirements.txt

      - name: Stage 1 - Code Quality & Linting
        run: |
          # Stop build on syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Treat all warnings as exit-zero
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Stage 2 - Docker Image Assembly
        run: |
          docker build -t aceest-fitness:latest .

      - name: Stage 3 - Automated In-Container Testing
        run: |
          docker run --rm aceest-fitness:latest pytest -v tests/