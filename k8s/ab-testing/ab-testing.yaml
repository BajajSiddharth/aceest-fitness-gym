# A/B testing: nginx routes by the "X-Variant: B" header (or "variant=B" cookie); everyone else gets variant A.
# Try: curl -H "X-Variant: B" http://$(minikube ip):30084/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-variant-a
spec:
  replicas: 2
  selector:
    matchLabels: {app: aceest-ab, variant: a}
  template:
    metadata:
      labels: {app: aceest-ab, variant: a}
    spec:
      containers:
        - name: aceest
          image: DOCKERHUB_USER/aceest-fitness:1.0.0
          ports: [{containerPort: 5000}]
          env:
            - {name: APP_VERSION, value: "1.0.0"}
            - {name: DEPLOY_COLOR, value: "variant-A"}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-variant-b
spec:
  replicas: 2
  selector:
    matchLabels: {app: aceest-ab, variant: b}
  template:
    metadata:
      labels: {app: aceest-ab, variant: b}
    spec:
      containers:
        - name: aceest
          image: DOCKERHUB_USER/aceest-fitness:2.0.0
          ports: [{containerPort: 5000}]
          env:
            - {name: APP_VERSION, value: "2.0.0"}
            - {name: DEPLOY_COLOR, value: "variant-B"}
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-variant-a
spec:
  selector: {app: aceest-ab, variant: a}
  ports: [{port: 80, targetPort: 5000}]
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-variant-b
spec:
  selector: {app: aceest-ab, variant: b}
  ports: [{port: 80, targetPort: 5000}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aceest-ab-nginx
data:
  default.conf: |
    map "$http_x_variant$cookie_variant" $backend {
      default aceest-variant-a;
      ~*B     aceest-variant-b;
    }
    server {
      listen 80;
      resolver kube-dns.kube-system.svc.cluster.local valid=10s;
      location / {
        proxy_pass http://$backend;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-ab-router
spec:
  replicas: 1
  selector:
    matchLabels: {app: aceest-ab-router}
  template:
    metadata:
      labels: {app: aceest-ab-router}
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports: [{containerPort: 80}]
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/conf.d}
      volumes:
        - name: conf
          configMap: {name: aceest-ab-nginx}
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-ab
spec:
  type: NodePort
  selector: {app: aceest-ab-router}
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30084
