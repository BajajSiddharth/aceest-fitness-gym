# Rolling Update (default strategy). Rollback: kubectl rollout undo deployment/aceest-rolling
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-rolling
  labels: {app: aceest, strategy: rolling}
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app: aceest, strategy: rolling}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels: {app: aceest, strategy: rolling}
    spec:
      containers:
        - name: aceest
          image: bajaj1995/aceest-fitness:1.0.0
          ports:
            - containerPort: 5000
          env:
            - {name: APP_VERSION, value: "1.0.0"}
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-rolling
spec:
  type: NodePort
  selector: {app: aceest, strategy: rolling}
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30080
