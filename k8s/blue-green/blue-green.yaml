# Blue-Green: two full deployments; the Service selector decides which one is live.
# Switch:   kubectl patch svc aceest-bg -p '{"spec":{"selector":{"app":"aceest-bg","color":"green"}}}'
# Rollback: kubectl patch svc aceest-bg -p '{"spec":{"selector":{"app":"aceest-bg","color":"blue"}}}'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-blue
spec:
  replicas: 2
  selector:
    matchLabels: {app: aceest-bg, color: blue}
  template:
    metadata:
      labels: {app: aceest-bg, color: blue}
    spec:
      containers:
        - name: aceest
          image: DOCKERHUB_USER/aceest-fitness:1.0.0
          ports: [{containerPort: 5000}]
          env:
            - {name: APP_VERSION, value: "1.0.0"}
            - {name: DEPLOY_COLOR, value: "blue"}
          readinessProbe:
            httpGet: {path: /health, port: 5000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-green
spec:
  replicas: 2
  selector:
    matchLabels: {app: aceest-bg, color: green}
  template:
    metadata:
      labels: {app: aceest-bg, color: green}
    spec:
      containers:
        - name: aceest
          image: DOCKERHUB_USER/aceest-fitness:2.0.0
          ports: [{containerPort: 5000}]
          env:
            - {name: APP_VERSION, value: "2.0.0"}
            - {name: DEPLOY_COLOR, value: "green"}
          readinessProbe:
            httpGet: {path: /health, port: 5000}
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-bg
spec:
  type: NodePort
  selector: {app: aceest-bg, color: blue}
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30081
