# Canary: one Service selects both tracks; traffic share ~ replica ratio (here 4:1 = 20% canary).
# Promote: scale canary up / stable down. Rollback: kubectl scale deploy aceest-canary --replicas=0
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-stable
spec:
  replicas: 4
  selector:
    matchLabels: {app: aceest-canary, track: stable}
  template:
    metadata:
      labels: {app: aceest-canary, track: stable}
    spec:
      containers:
        - name: aceest
          image: DOCKERHUB_USER/aceest-fitness:1.0.0
          ports: [{containerPort: 5000}]
          env:
            - {name: APP_VERSION, value: "1.0.0"}
          readinessProbe:
            httpGet: {path: /health, port: 5000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary
spec:
  replicas: 1
  selector:
    matchLabels: {app: aceest-canary, track: canary}
  template:
    metadata:
      labels: {app: aceest-canary, track: canary}
    spec:
      containers:
        - name: aceest
          image: DOCKERHUB_USER/aceest-fitness:2.0.0
          ports: [{containerPort: 5000}]
          env:
            - {name: APP_VERSION, value: "2.0.0"}
          readinessProbe:
            httpGet: {path: /health, port: 5000}
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-canary
spec:
  type: NodePort
  selector: {app: aceest-canary}
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30082
