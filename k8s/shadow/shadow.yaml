# Shadow: an nginx proxy serves users from v1 and mirrors every request to v2; v2 responses are discarded.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow-live
spec:
  replicas: 2
  selector:
    matchLabels: {app: aceest-shadow, role: live}
  template:
    metadata:
      labels: {app: aceest-shadow, role: live}
    spec:
      containers:
        - name: aceest
          image: bajaj1995/aceest-fitness:1.0.0
          ports: [{containerPort: 5000}]
          env:
            - {name: APP_VERSION, value: "1.0.0"}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow-mirror
spec:
  replicas: 1
  selector:
    matchLabels: {app: aceest-shadow, role: mirror}
  template:
    metadata:
      labels: {app: aceest-shadow, role: mirror}
    spec:
      containers:
        - name: aceest
          image: bajaj1995/aceest-fitness:2.0.0
          ports: [{containerPort: 5000}]
          env:
            - {name: APP_VERSION, value: "2.0.0"}
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow-live
spec:
  selector: {app: aceest-shadow, role: live}
  ports: [{port: 80, targetPort: 5000}]
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow-mirror
spec:
  selector: {app: aceest-shadow, role: mirror}
  ports: [{port: 80, targetPort: 5000}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aceest-shadow-nginx
data:
  default.conf: |
    upstream live   { server aceest-shadow-live:80; }
    upstream mirror { server aceest-shadow-mirror:80; }
    server {
      listen 80;
      location / {
        mirror /mirror;
        mirror_request_body on;
        proxy_pass http://live;
      }
      location = /mirror {
        internal;
        proxy_pass http://mirror$request_uri;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow-proxy
spec:
  replicas: 1
  selector:
    matchLabels: {app: aceest-shadow, role: proxy}
  template:
    metadata:
      labels: {app: aceest-shadow, role: proxy}
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports: [{containerPort: 80}]
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/conf.d}
      volumes:
        - name: conf
          configMap: {name: aceest-shadow-nginx}
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow
spec:
  type: NodePort
  selector: {app: aceest-shadow, role: proxy}
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30083
